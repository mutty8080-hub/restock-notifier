name: Restock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's practical minimum)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: restock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python monitor.py

      - name: Commit updated watchlist/state
        run: |
          git config user.name "restock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watchlist.json state.json
          git diff --quiet --cached || git commit -m "Update watchlist/state [skip ci]"
          git push
