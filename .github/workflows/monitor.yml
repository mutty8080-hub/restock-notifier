name: Restock Monitor

on:
  # Scheduling is handled externally by cron-job.org calling this workflow's
  # dispatch endpoint every 5 min — GitHub's own native `schedule:` trigger was
  # removed because running both caused overlapping/canceled runs.
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification instead of checking products"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: restock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]  # 3 parallel shards — raise this list (and SHARD_COUNT below) to scale further
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (shard ${{ matrix.shard }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_MODE: ${{ github.event.inputs.test }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: python monitor.py

      - name: Commit updated watchlist/state
        run: |
          git config user.name "restock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watchlist.json
          [ -f state_shard${{ matrix.shard }}.json ] && git add state_shard${{ matrix.shard }}.json
          git diff --quiet --cached || git commit -m "Update watchlist/state (shard ${{ matrix.shard }}) [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase -X ours origin main
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i), retrying after a short random delay..."
            sleep $((RANDOM % 5 + 1))
          done
